<svg viewBox="0 0 760 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two ways to add a paper (add-doi, or search then Claude selects then add) both write into literature.json; list/tags and export-bib both read from it, and export-bib writes literature.bib.">
  <title>literature-skill 資料流</title>
  <desc>新增一篇文獻分成兩條路:有 DOI 走 add-doi,還要找就 search/篩選/add;兩條路都寫入 literature.json。list/tags 跟 export-bib 都從 literature.json 讀取;export-bib 會寫出 literature.bib。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/>
    </marker>
  </defs>

  <!-- edges (drawn first, under the boxes) -->
  <g stroke="#5b6b7f" stroke-width="1.5" fill="none">
    <line x1="380" y1="78" x2="230" y2="162" marker-end="url(#arrow)"/>
    <line x1="380" y1="78" x2="530" y2="162" marker-end="url(#arrow)"/>
    <line x1="590" y1="218" x2="590" y2="292" marker-end="url(#arrow)"/>
    <line x1="590" y1="348" x2="590" y2="422" marker-end="url(#arrow)"/>
    <polyline points="170,218 170,500 365,500 365,552" marker-end="url(#arrow)"/>
    <polyline points="590,478 590,500 395,500 395,552" marker-end="url(#arrow)"/>
    <polyline points="380,608 380,650 170,650 170,682" marker-end="url(#arrow)"/>
    <polyline points="380,608 380,650 590,650 590,682" marker-end="url(#arrow)"/>
    <line x1="590" y1="738" x2="590" y2="812" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#55606e" text-anchor="middle">
    <text x="290" y="108">有 DOI</text>
    <text x="475" y="108">還要找</text>
    <text x="640" y="257">候選清單</text>
    <text x="640" y="387">選定</text>
    <text x="267" y="490">寫入</text>
    <text x="493" y="490">寫入</text>
    <text x="275" y="640">讀取</text>
    <text x="485" y="640">讀取</text>
    <text x="640" y="777">寫入</text>
  </g>

  <!-- nodes -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13.5">
    <!-- N0 entry -->
    <rect x="280" y="22" width="200" height="56" rx="8" fill="#dce7f7" stroke="#2f5aa8" stroke-width="1.5"/>
    <text x="380" y="54" text-anchor="middle" fill="#14213d">新增一篇文獻</text>

    <!-- N1 add-doi -->
    <rect x="70" y="162" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="170" y="194" text-anchor="middle" fill="#1c2530">add-doi</text>

    <!-- N2 search -->
    <rect x="490" y="162" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="590" y="194" text-anchor="middle" fill="#1c2530">search (OpenAlex)</text>

    <!-- N3 claude selects -->
    <rect x="490" y="292" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="590" y="315" text-anchor="middle" fill="#1c2530">Claude 篩選</text>
    <text x="590" y="332" text-anchor="middle" fill="#1c2530">真正相關的結果</text>

    <!-- N4 add -->
    <rect x="490" y="422" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="590" y="454" text-anchor="middle" fill="#1c2530">add (+ tags)</text>

    <!-- N5 literature.json -->
    <rect x="280" y="552" width="200" height="56" rx="8" fill="#eee7fb" stroke="#6b4fbb" stroke-width="1.5"/>
    <text x="380" y="584" text-anchor="middle" fill="#241b40" font-family="Consolas, monospace">literature.json</text>

    <!-- N6 list/tags -->
    <rect x="70" y="682" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="170" y="714" text-anchor="middle" fill="#1c2530">list / tags</text>

    <!-- N7 export-bib -->
    <rect x="490" y="682" width="200" height="56" rx="8" fill="#f4f6f8" stroke="#5b6b7f" stroke-width="1.5"/>
    <text x="590" y="714" text-anchor="middle" fill="#1c2530">export-bib</text>

    <!-- N8 literature.bib -->
    <rect x="490" y="812" width="200" height="56" rx="8" fill="#eee7fb" stroke="#6b4fbb" stroke-width="1.5"/>
    <text x="590" y="844" text-anchor="middle" fill="#241b40" font-family="Consolas, monospace">literature.bib</text>
  </g>
</svg>
